    <section class="filter-section" data-aos="fade-up" data-aos-delay="100">

        <h2 class="filter-title">

        </h2>

  <script>
    // Initialize AOS
    AOS.init({
      duration: 800,
      easing: 'ease-in-out',
      once: true
    });

    // Set default date to today
    document.getElementById('filterDate').valueAsDate = new Date();
    document.getElementById('filterDate').addEventListener('change', fetchTips);

    async function fetchTips() {
      const tipsContainer = document.getElementById('tips');
      const loadingEl = document.getElementById('loading');
      
      tipsContainer.innerHTML = '';
      loadingEl.style.display = 'flex';

      const selectedDateInput = document.getElementById('filterDate').value;
      if (!selectedDateInput) return;
      
      const [yyyy, mm, dd] = selectedDateInput.split('-');
      const selectedDate = `${dd}-${mm}-${yyyy}`;

      const formData = new URLSearchParams({
        firstopen: '0',
        accountId: '1805',
        itemId: '0',
        matchtype: '1',
        accessToken: 'ac7648fba373b484177f5d51dcdc5eff',
        selecteddate: selectedDate
      });

      try {
        const response = await fetch('https://corsproxy.io/?' + encodeURIComponent('http://playconsole.org/api/v2/method/freeget'), {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: formData
        });

        if (!response.ok) throw new Error(`HTTP ${response.status}: ${response.statusText}`);

        const text = await response.text();
        if (!text.trim()) throw new Error('Empty response from server');

        const data = JSON.parse(text);
        loadingEl.style.display = 'none';

        if (data.error || !data.items || !data.items.length) {
          tipsContainer.innerHTML = `
            <div class="empty-state" data-aos="fade-up">
              <i class="fas fa-calendar-times"></i>
              <h3>No Tips Available</h3>
              <p>No betting tips found for the selected date. Please try another date.</p>
            </div>
          `;
          return;
        }

        // Create tip cards with animations
        data.items.forEach((item, index) => {
          const card = document.createElement('div');
          card.className = 'tip-card';
          card.setAttribute('data-aos', 'fade-up');
          card.setAttribute('data-aos-delay', `${index * 100}`);

          const getStatusClass = (status) => {
            const statusLower = status.toLowerCase();
            if (statusLower.includes('live') || statusLower.includes('ongoing')) return 'status-live';
            if (statusLower.includes('finished') || statusLower.includes('completed')) return 'status-finished';
            return 'status-upcoming';
          };

          const getStatusIcon = (status) => {
            const statusLower = status.toLowerCase();
            if (statusLower.includes('live') || statusLower.includes('ongoing')) return 'fas fa-circle';
            if (statusLower.includes('finished') || statusLower.includes('completed')) return 'fas fa-check-circle';
            return 'fas fa-clock';
          };

          card.innerHTML = `
            <div class="card-header">
              <h3 class="match-title">${item.team1} vs ${item.team2}</h3>
              <div class="match-time">
                <i class="fas fa-clock"></i>
                ${item.matchdate} ${item.matchtime}
              </div>
            </div>
            <div class="card-content">
              <div class="teams-section">
                <div class="team">
                  <div class="team-logo">
                    <img src="${item.team1logo}" alt="${item.team1}" onerror="this.style.display='none'">
                  </div>
                  <div class="team-name">${item.team1}</div>
                </div>
                <div class="vs">VS</div>
                <div class="team">
                  <div class="team-logo">
                    <img src="${item.team2logo}" alt="${item.team2}" onerror="this.style.display='none'">
                  </div>
                  <div class="team-name">${item.team2}</div>
                </div>
              </div>
              
              <div class="league-info">
                <img src="${item.leaguelogo}" alt="League" class="league-logo" onerror="this.style.display='none'">
                <span class="league-name">${item.league}</span>
              </div>
              
              <div class="tip-details">
                <div class="tip-label">Our Prediction</div>
                <div class="tip-prediction">${item.guesstip} - ${item.guess}</div>
                <div class="tip-odds">
                  <i class="fas fa-chart-line"></i>
                  Odds: @${item.odd}
                </div>
              </div>
              
              <div class="status-badge ${getStatusClass(item.durum)}">
                <i class="${getStatusIcon(item.durum)}"></i>
                ${item.durum}
              </div>
            </div>
          `;

          tipsContainer.appendChild(card);
        });

        // Reinitialize AOS for new elements
        AOS.refresh();

      } catch (err) {
        loadingEl.innerHTML = `
          <div class="empty-state">
            <i class="fas fa-exclamation-triangle"></i>
            <h3>Error Loading Tips</h3>
            <p>${err.message}</p>
          </div>
        `;
        console.error('Error fetching tips:', err);
      }
    }

    // Initial load
    fetchTips();
  </script>
