  <style>
    :root {
      --primary-color: #1a1a2e;
      --secondary-color: #16213e;
      --accent-color: #0f3460;
      --success-color: #00d4aa;
      --warning-color: #ffa726;
      --danger-color: #ff6b6b;
      --text-primary: #ffffff;
      --text-secondary: #b0b0b0;
      --text-muted: #888888;
      --border-color: #2a2a3e;
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-hover: rgba(255, 255, 255, 0.1);
      --gradient-primary: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      --gradient-secondary: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      --shadow-light: 0 4px 6px rgba(0, 0, 0, 0.1);
      --shadow-medium: 0 8px 25px rgba(0, 0, 0, 0.15);
      --shadow-heavy: 0 15px 35px rgba(0, 0, 0, 0.2);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--primary-color);
      color: var(--text-primary);
      line-height: 1.6;
      overflow-x: hidden;
    }

    /* Header Styles */
    .header {
      background: var(--secondary-color);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 1000;
      padding: 1rem 0;
    }

    .header-content {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--success-color);
    }

    .logo i {
      font-size: 2rem;
    }

    .nav-links {
      display: flex;
      gap: 2rem;
      list-style: none;
    }

    .nav-links a {
      color: var(--text-secondary);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.3s ease;
      position: relative;
    }

    .nav-links a:hover {
      color: var(--success-color);
    }

    .nav-links a::after {
      content: '';
      position: absolute;
      bottom: -5px;
      left: 0;
      width: 0;
      height: 2px;
      background: var(--success-color);
      transition: width 0.3s ease;
    }

    .nav-links a:hover::after {
      width: 100%;
    }

    /* Main Container */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
    }

    /* Hero Section */
    .hero {
      text-align: center;
      margin-bottom: 3rem;
      padding: 3rem 0;
    }

    .hero h1 {
      font-size: 3rem;
      font-weight: 800;
      margin-bottom: 1rem;
      background: var(--gradient-primary);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero p {
      font-size: 1.2rem;
      color: var(--text-secondary);
      margin-bottom: 2rem;
    }

    /* Filter Section */
    .filter-section {
      background: var(--card-bg);
      border-radius: 15px;
      padding: 2rem;
      margin-bottom: 2rem;
      border: 1px solid var(--border-color);
      backdrop-filter: blur(10px);
    }

    .filter-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .filter-title {
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--text-primary);
    }

    .filter-controls {
      display: flex;
      gap: 1rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .filter-controls select,
    .filter-controls input {
      padding: 0.75rem 1rem;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background: var(--secondary-color);
      color: var(--text-primary);
      font-size: 1rem;
      transition: all 0.3s ease;
    }

    .filter-controls select:focus,
    .filter-controls input:focus {
      outline: none;
      border-color: var(--success-color);
      box-shadow: 0 0 0 3px rgba(0, 212, 170, 0.1);
    }

    .refresh-btn {
      background: var(--gradient-primary);
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .refresh-btn:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-medium);
    }

    .refresh-btn i {
      transition: transform 0.3s ease;
    }

    .refresh-btn:hover i {
      transform: rotate(180deg);
    }

    /* Loading Animation */
    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 3rem;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 3px solid var(--border-color);
      border-top: 3px solid var(--success-color);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Live Indicator */
    .live-indicator {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(255, 107, 107, 0.2);
      color: var(--danger-color);
      padding: 0.5rem 1rem;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: 600;
      border: 1px solid rgba(255, 107, 107, 0.3);
    }

    .live-indicator::before {
      content: '';
      width: 8px;
      height: 8px;
      background: var(--danger-color);
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.5; }
      100% { opacity: 1; }
    }

    /* Matches Grid */
    .matches-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
      gap: 1.5rem;
      margin-top: 2rem;
    }

    .match-card {
      background: var(--card-bg);
      border-radius: 15px;
      border: 1px solid var(--border-color);
      overflow: hidden;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
      position: relative;
    }

    .match-card:hover {
      transform: translateY(-5px);
      box-shadow: var(--shadow-heavy);
      border-color: var(--success-color);
    }

    .match-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--gradient-primary);
      transform: scaleX(0);
      transition: transform 0.3s ease;
    }

    .match-card:hover::before {
      transform: scaleX(1);
    }

    .match-header {
      padding: 1.5rem;
      border-bottom: 1px solid var(--border-color);
      background: rgba(255, 255, 255, 0.02);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .league-info {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .league-logo {
      width: 24px;
      height: 24px;
      border-radius: 50%;
    }

    .league-name {
      font-size: 0.9rem;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .match-status {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .status-live {
      color: var(--danger-color);
    }

    .status-finished {
      color: var(--success-color);
    }

    .status-upcoming {
      color: var(--warning-color);
    }

    .match-content {
      padding: 1.5rem;
    }

    .teams-section {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
    }

    .team {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      flex: 1;
    }

    .team-logo {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: var(--secondary-color);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--border-color);
      transition: all 0.3s ease;
    }

    .team-logo img {
      width: 40px;
      height: 40px;
      object-fit: contain;
    }

    .team-name {
      font-weight: 600;
      text-align: center;
      font-size: 1rem;
      color: var(--text-primary);
    }

    .score-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      margin: 0 1rem;
    }

    .score {
      font-size: 2rem;
      font-weight: 800;
      color: var(--success-color);
    }

    .vs {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .match-time {
      font-size: 0.9rem;
      color: var(--text-secondary);
      text-align: center;
    }

    .match-details {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 1rem;
      border-top: 1px solid var(--border-color);
    }

    .match-info {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .match-date {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .match-venue {
      font-size: 0.8rem;
      color: var(--text-secondary);
    }

    .match-actions {
      display: flex;
      gap: 0.5rem;
    }

    .action-btn {
      background: var(--accent-color);
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      color: var(--text-primary);
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.25rem;
    }

    .action-btn:hover {
      background: var(--success-color);
      transform: translateY(-2px);
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 3rem;
      color: var(--text-secondary);
    }

    .empty-state i {
      font-size: 4rem;
      margin-bottom: 1rem;
      color: var(--text-muted);
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      .header-content {
        flex-direction: column;
        gap: 1rem;
      }

      .nav-links {
        gap: 1rem;
      }

      .hero h1 {
        font-size: 2rem;
      }

      .filter-header {
        flex-direction: column;
        align-items: stretch;
      }

      .filter-controls {
        flex-direction: column;
        align-items: stretch;
      }

      .matches-grid {
        grid-template-columns: 1fr;
      }

      .teams-section {
        flex-direction: column;
        gap: 1rem;
      }

      .score-section {
        margin: 0;
      }

      .match-details {
        flex-direction: column;
        gap: 1rem;
        align-items: stretch;
      }
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: var(--secondary-color);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--accent-color);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--success-color);
    }
  </style>
</head>

    function getStatusClass(status) {
      switch(status) {
        case 'live': return 'status-live';
        case 'finished': return 'status-finished';
        case 'upcoming': return 'status-upcoming';
        default: return 'status-upcoming';
      }
    }

    function getStatusIcon(status) {
      switch(status) {
        case 'live': return 'fas fa-circle';
        case 'finished': return 'fas fa-check-circle';
        case 'upcoming': return 'fas fa-clock';
        default: return 'fas fa-clock';
      }
    }

    function formatDate(dateString) {
      const date = new Date(dateString);
      return date.toLocaleDateString('en-US', { 
        weekday: 'short', 
        year: 'numeric', 
        month: 'short', 
        day: 'numeric' 
      });
    }

    function renderMatches(matches) {
      const matchesContainer = document.getElementById('matches');
      matchesContainer.innerHTML = '';

      if (!matches || matches.length === 0) {
        matchesContainer.innerHTML = `
          <div class="empty-state" data-aos="fade-up">
            <i class="fas fa-futbol"></i>
            <h3>No Matches Found</h3>
            <p>No matches available for the selected filters.</p>
          </div>
        `;
        return;
      }

      matches.forEach((match, index) => {
        const card = document.createElement('div');
        card.className = 'match-card';
        card.setAttribute('data-aos', 'fade-up');
        card.setAttribute('data-aos-delay', `${index * 100}`);

        card.innerHTML = `
          <div class="match-header">
            <div class="league-info">
              <img src="${match.leagueLogo}" alt="${match.league}" class="league-logo" onerror="this.style.display='none'">
              <span class="league-name">${match.league}</span>
            </div>
            <div class="match-status ${getStatusClass(match.status)}">
              <i class="${getStatusIcon(match.status)}"></i>
              ${match.status.toUpperCase()}
            </div>
          </div>
          <div class="match-content">
            <div class="teams-section">
              <div class="team">
                <div class="team-logo">
                  <img src="${match.homeLogo}" alt="${match.homeTeam}" onerror="this.style.display='none'">
                </div>
                <div class="team-name">${match.homeTeam}</div>
              </div>
              <div class="score-section">
                <div class="score">${match.homeScore} - ${match.awayScore}</div>
                <div class="vs">VS</div>
                <div class="match-time">${match.time}</div>
              </div>
              <div class="team">
                <div class="team-logo">
                  <img src="${match.awayLogo}" alt="${match.awayTeam}" onerror="this.style.display='none'">
                </div>
                <div class="team-name">${match.awayTeam}</div>
              </div>
            </div>
            <div class="match-details">
              <div class="match-info">
                <div class="match-date">${formatDate(match.date)}</div>
                <div class="match-venue">${match.venue}</div>
              </div>
              <div class="match-actions">
                <a href="#" class="action-btn">
                  <i class="fas fa-chart-line"></i>
                  Stats
                </a>
                <a href="#" class="action-btn">
                  <i class="fas fa-tv"></i>
                  Watch
                </a>
              </div>
            </div>
          </div>
        `;

        matchesContainer.appendChild(card);
      });

      // Reinitialize AOS for new elements
      AOS.refresh();
    }

    function filterMatches() {
      const leagueFilter = document.getElementById('leagueFilter').value;
      const statusFilter = document.getElementById('statusFilter').value;

      let filteredMatches = sampleMatches;

      if (leagueFilter) {
        filteredMatches = filteredMatches.filter(match => 
          match.league.toLowerCase().includes(leagueFilter.toLowerCase())
        );
      }

      if (statusFilter) {
        filteredMatches = filteredMatches.filter(match => 
          match.status === statusFilter
        );
      }

      renderMatches(filteredMatches);
    }

    function refreshScores() {
      const refreshBtn = document.querySelector('.refresh-btn');
      const icon = refreshBtn.querySelector('i');
      
      // Add spinning animation
      icon.style.transform = 'rotate(360deg)';
      
      // Simulate API call delay
      setTimeout(() => {
        icon.style.transform = 'rotate(0deg)';
        renderMatches(sampleMatches);
      }, 1000);
    }

    // Event listeners
    document.getElementById('leagueFilter').addEventListener('change', filterMatches);
    document.getElementById('statusFilter').addEventListener('change', filterMatches);

    // Auto-refresh every 30 seconds
    setInterval(refreshScores, 30000);

    // Initial load
    renderMatches(sampleMatches);
    document.getElementById('loading').style.display = 'none';
  </script>
